[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capxure"
version = "0.1.0"
description = "TUI app that captures GitHub repo metadata and READMEs"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
capxure = "capxure.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capxure"]
