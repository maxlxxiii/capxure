[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capxure"
version = "0.1.0"
description = "Library for capturing GitHub repo metadata and READMEs locally"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "platformdirs>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capxure"]
